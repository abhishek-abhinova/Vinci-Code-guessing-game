<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vinci Game</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <h1><Hello</h1>
<video autoplay muted loop id="bgVideo">
  <source src="abc.mp4" type="video/mp4">
  Your browser does not support HTML5 video.
</video>
		
  <div class="container">
    <h1>🎲 Vinci Game</h1>
    
    <div id="player-setup">
      <label for="numPlayers">Number of Players (2-5):</label>
      <input type="number" id="numPlayers" min="2" max="5" />
      <div id="names"></div>
      <button onclick="startGame()">Start Game</button>
    </div>

    <div id="game" style="display:none;">
      <div id="board" class="board"></div>
      <div class="info">
        <div id="turnDisplay"></div>
        <div id="scoreDisplay"></div>
      </div>
      <button onclick="undoMove()">Undo Last Move</button>
    </div>
  </div>

  <script src="script.js">
document.getElementById('numPlayers').addEventListener('change', function() {
  const val = parseInt(this.value);
  const namesDiv = document.getElementById('names');
  namesDiv.innerHTML = "";
  if (val >= 2 && val <= 5) {
  for (let i = 1; i <= val; i++) {
      namesDiv.innerHTML += '<input type="text" id="player${i}" placeholder="Player ${i} Name" /><br>';
    }
  }
});
</script>
</body>
</html>
